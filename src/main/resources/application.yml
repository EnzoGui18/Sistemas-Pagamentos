spring:
  application:
    name: fluxo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fluxo}
    username: ${DB_USERNAME:fluxo}
    password: ${DB_PASSWORD:fluxo_local}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never
